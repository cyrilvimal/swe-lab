name: Markdown Quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
